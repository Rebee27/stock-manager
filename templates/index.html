<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Stock & Order Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="padding: 40px; font-family: sans-serif; max-width: 800px; margin: auto;">
        <h1>Gestiune Stocuri (SQLite)</h1>

        <!-- Formular pentru adăugare produs nou -->
        <div style="background: #f9f9f9; padding: 20px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #ddd;">
            <h3>Adaugă produs nou</h3>
            <form action="/add" method="POST">
                <div style="margin-bottom: 10px;">
                    <label>Nume Produs:</label><br>
                    <input type="text" name="name" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label>Cantitate:</label><br>
                    <input type="number" name="quantity" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label>Preț (RON):</label><br>
                    <input type="number" step="0.01" name="price" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <button type="submit" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Adaugă Produs</button>
            </form>
        </div>

        <!-- Tabelul cu produse -->
        <h3>Lista Stocuri</h3>
        <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse;">
            <tr style="background: #f2f2f2;">
                <th>ID</th>
                <th>Nume Produs</th>
                <th>Cantitate</th>
                <th>Preț</th>
            </tr>
            {% for product in products %} <!-- Iterează prin fiecare produs din lista de produse -->
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.quantity }}</td>
                <td>{{ product.price }} RON</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
